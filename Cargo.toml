[workspace]
resolver = "3"
members = ["crates/kauppa-core", "crates/kauppa-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/juuso-kalliomaki/kauppa-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
# Runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }

# Web
# Default features minus `compress-zstd` (RUSTSEC-2026-0391/0398/0403 via zstd)
# and `http2` (actix-http pins to h2 0.3 which has RUSTSEC-2026-0258;
# h2 0.4 is a breaking migration for actix). Deploy behind a reverse proxy
# that terminates HTTP/2 if you need it. `ws` dropped — not using websockets.
actix-web = { version = "4", default-features = false, features = [
    "macros",
    "cookies",
    "unicode",
    "compat",
    "compress-brotli",
    "compress-gzip",
] }
actix-files = "0.6"
actix-session = { version = "0.10", features = ["cookie-session"] }
actix-identity = "0.8"
tracing-actix-web = "0.7"

# Persistence
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }

# Templating
handlebars = { version = "6", features = ["dir_source"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
anyhow = "1"
thiserror = "2"

# Async traits (needed for `dyn Trait` with async methods)
async-trait = "0.1"

# Crypto / IDs
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Config
config = { version = "0.15", default-features = false, features = ["toml"] }
dotenvy = "0.15"

# Testing
proptest = "1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
