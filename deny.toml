[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
ignore = [
    # RR-0016 (MB-0041): interim, until an sqlx release accepts libsqlite3-sys
    # >= 0.39 (SQLite >= 3.54.0). Review by 2026-12-31; MB-0041 removes it.
    { id = "RUSTSEC-2026-0459", reason = "SQLite < 3.54.0 crafted -wal read (local, attacker-written db + wal); no sqlx release allows the fixed libsqlite3-sys yet. RR-0016, review by 2026-12-31." },
]

[licenses]
version = 2
# Only licenses actually encountered in the current dep tree are listed; add
# new entries as they appear. Keeps `license-not-encountered` warnings clean.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# allow path deps inside the workspace to omit a version field
workspace-default-features = "allow"

# Transitive duplicates we cannot resolve without patching upstream crates.
# Review and prune every quarter; new entries require a Resolution Record
# citing why the duplicate cannot be collapsed.
skip = [
    # Windows shims: ring pulls windows-sys 0.52; tokio, mio, socket2, rustix
    # and tempfile pull 0.61. We don't ship Windows binaries.
    { crate = "windows-sys" },

    # proc-macro ecosystem split: syn 2.x (sqlx-macros, derive_more-impl,
    # tracing-attributes) and syn 3.x (serde_derive, actix-web-codegen,
    # thiserror-impl, tokio-macros). Collapsing requires upstream bumps.
    { crate = "syn" },

    # cookie 0.16 (via actix-web) uses base64 0.20; sqlx uses 0.22.
    { crate = "base64" },

    # actix-identity/session depend on derive_more 1.0; actix-web 4.18 on 2.1.
    { crate = "derive_more" },
    { crate = "derive_more-impl" },

    # sqlx-core/hashlink use hashbrown 0.15 (foldhash 0.1); actix-web 4.18 uses
    # a newer hashbrown with foldhash 0.2.
    { crate = "hashbrown" },
    { crate = "foldhash" },

    # getrandom 0.2 (ring, rand_core 0.6) coexists with 0.4 (uuid, tempfile,
    # rand 0.10); same story for rand_core 0.6 (password-hash, rand 0.8) vs
    # 0.10 (proptest's rand 0.10 and chacha20).
    { crate = "getrandom" },
    { crate = "rand_core" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
