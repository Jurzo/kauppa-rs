# Deployment checks and the GHCR image (MB-0022, RR-0014 Q7).
#
#   image      PRs touching the image's inputs: build deploy/Dockerfile, run
#              scripts/deploy/smoke_image.sh (P1, P2) and smoke_compose.sh
#              (P3, Caddy's internal CA) and backup_restore_drill.sh (P5;
#              MB-0045, RR-0032 sub-answer 4). On push to main and on tags, also
#              push ghcr.io/jurzo/kauppa-rs:sha-<commit> (+ :main / :<tag>).
#   terraform  PRs touching deploy/terraform: scripts/deploy/check_terraform.sh
#              (P4), with no credentials.
#   secrets    every PR: scripts/deploy/check_no_secrets.sh (P6).
#
# No deploy job, and no credential beyond GITHUB_TOKEN: CI never holds an SSH
# key, DigitalOcean token or Spaces key (RR-0014 constraint 7). The droplet
# pulls the public image itself.

name: deploy

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/jurzo/kauppa-rs

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.diff.outputs.image }}
      terraform: ${{ steps.diff.outputs.terraform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - id: diff
        name: Which jobs this change needs
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "$files"
          # The image's inputs (RR-0014 Q7), plus the scripts and workflow that test it.
          if grep -qE '^(deploy/|crates/|templates/|locales/|assets/|migrations/|Cargo\.|\.dockerignore$|scripts/deploy/|\.github/workflows/deploy\.yml$)' <<<"$files"; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(deploy/terraform/|scripts/deploy/(check_terraform|lib)\.sh$|\.github/workflows/deploy\.yml$)' <<<"$files"; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: image build, smoke tests, push (main)
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Used only by the push steps, which run only on push to main or a tag.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build the image (linux/amd64, as on the droplet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          build-args: KAUPPA_REVISION=${{ github.sha }}
          tags: kauppa-rs:smoke
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke_image.sh (P1, P2)
        env:
          KAUPPA_SMOKE_IMAGE: kauppa-rs:smoke
        run: scripts/deploy/smoke_image.sh

      - name: smoke_compose.sh (P3, local CA)
        env:
          KAUPPA_SMOKE_IMAGE: kauppa-rs:smoke
        run: scripts/deploy/smoke_compose.sh

      # Builds the backup image and restores a backup taken while the app
      # writes; no credentials (scripts/deploy/compose.drill.yaml).
      - name: backup_restore_drill.sh (P5, restore drill)
        env:
          KAUPPA_SMOKE_IMAGE: kauppa-rs:smoke
        run: scripts/deploy/backup_restore_drill.sh

      - name: Image tags
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          build-args: KAUPPA_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha

  terraform:
    name: terraform checks (no credentials)
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: check_terraform.sh (P4)
        run: scripts/deploy/check_terraform.sh

  secrets:
    name: no secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: check_no_secrets.sh (P6)
        run: scripts/deploy/check_no_secrets.sh
