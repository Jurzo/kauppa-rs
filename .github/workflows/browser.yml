name: browser

# MB-0047 (RR-0041): the Playwright flows in tests/browser/ against the
# built app, with the pinned Chromium (scripts/browser/run.sh). Not a
# required check at first; MB-0047's Continuity Pack records its timings and
# any flake for the owner's review (RR-0041 sub-answer 3).

on:
  pull_request:
    paths:
      - "templates/**"
      - "assets/**"
      - "crates/kauppa-web/**"
      - "tests/browser/**"
      - "scripts/browser/**"
      - ".github/workflows/browser.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  browser:
    name: browser (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The version comes from rust-toolchain.toml, as in ci.yml.
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          want=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustc --version | grep -F "rustc $want "

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: browser-release

      # An exact Node version (RR-0041 sub-answer 2).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.13.0"

      # The lockfile pins Playwright; no install scripts run. The browser
      # comes from the pinned Playwright version.
      - name: Install Playwright and its Chromium
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright --version
          npx --no-install playwright install --with-deps chromium

      - name: scripts/browser/run.sh
        run: scripts/browser/run.sh

      - name: Keep traces of failed flows
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: browser-test-results
          path: tests/browser/test-results/
          retention-days: 7
