name: agentic-gate

on:
  pull_request:
    # The three default types, plus `edited`: a bot PR that touches a trigger
    # path gets its "Standing approval: RR-0032, class N" line added to the
    # body by hand, and that edit must re-run the trigger check (RR-0032
    # sub-answer 3c, constraint 4).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-artifacts:
    name: validate .agentic/ artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install validator deps
        run: pip install jsonschema pyyaml

      - name: Validate Mission Briefs / Consults / Resolutions
        run: python scripts/agentic/validate_artifacts.py

  evidence-check:
    name: Merge-Readiness evidence
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'agent-authored')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Check Merge-Readiness Pack
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: python scripts/agentic/check_ready.py

  trigger-path-check:
    name: Escalation trigger paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Check trigger paths against RRs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: python scripts/agentic/check_triggers.py

  agentic-scripts:
    name: agentic scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      # check_triggers.py against throwaway repositories (MB-0033, MB-0043).
      - name: test_check_triggers.sh
        run: scripts/agentic/test_check_triggers.sh

      # Action pins, permissions, one Rust version (MB-0045 P1, P2).
      - name: check_workflows.sh
        run: scripts/agentic/check_workflows.sh
